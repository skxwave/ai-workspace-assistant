[project]
name = "ai-workspace-assistant"
version = "0.1.0"
description = "Internal AI assistant for engineers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.3",
    "fastapi[standard]>=0.139.2",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.1",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.4.1",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "mcp>=1.24.0,<2.0.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=6.14.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]
