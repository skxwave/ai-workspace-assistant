services:
  db:
    image: postgres:18
    container_name: db
    restart: always
    environment:
      - POSTGRES_DB=${BOT__DB__POSTGRES__DB}
      - POSTGRES_USER=${BOT__DB__POSTGRES__USER}
      - POSTGRES_PASSWORD=${BOT__DB__POSTGRES__PASSWORD}
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - ./.data/postgres:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: redis
    env_file:
      - .env
    ports:
      - 6379:6379
    volumes:
      - ./.data/redis:/data

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP
      - "6334:6334"  # gRPC
    environment:
      - QDRANT__SERVICE__API_KEY=${BOT__DB__QDRANT__KEY}
    env_file:
      - .env
    volumes:
      - ./.data/qdrant_data:/qdrant/storage
      - ./.data/qdrant_snapshots:/qdrant/snapshots
