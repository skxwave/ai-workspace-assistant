services:
  db:
    image: postgres:18
    container_name: db
    restart: always
    environment:
      - POSTGRES_DB=${BOT__DB__POSTGRES__DB}
      - POSTGRES_USER=${BOT__DB__POSTGRES__USER}
      - POSTGRES_PASSWORD=${BOT__DB__POSTGRES__PASSWORD}
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOT__DB__POSTGRES__USER} -d ${BOT__DB__POSTGRES__DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-network

  redis:
    image: redis:8
    container_name: redis
    env_file:
      - .env
    ports:
      - 6379:6379
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-network

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP
      - "6334:6334"  # gRPC
    environment:
      - QDRANT__SERVICE__API_KEY=${BOT__DB__QDRANT__KEY}
    env_file:
      - .env
    volumes:
      - ./.data/qdrant_data:/qdrant/storage
      - ./.data/qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-network

  migrate:
    image: ai-workspace-assistant:latest
    container_name: migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      - BOT__DB__POSTGRES__HOST=db
      - BOT__DB__POSTGRES__PORT=5432
      - BOT__DB__REDIS__HOST=redis
      - BOT__DB__QDRANT__URL=http://qdrant:6333
      - BOT__DB__QDRANT__HOST=qdrant
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - agent-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-workspace-assistant:latest
    container_name: app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BOT__DB__POSTGRES__HOST=db
      - BOT__DB__POSTGRES__PORT=5432
      - BOT__DB__REDIS__HOST=redis
      - BOT__DB__QDRANT__URL=http://qdrant:6333
      - BOT__DB__QDRANT__HOST=qdrant
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
