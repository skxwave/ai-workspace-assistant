services:
  db:
    image: postgres:18
    container_name: db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - ./.data/postgres:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: redis
    env_file:
      - .env
    ports:
      - 6379:6379
    volumes:
      - ./.data/redis:/data

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP
      - "6334:6334"  # gRPC
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_KEY}
    env_file:
      - .env
    volumes:
      - ./.data/qdrant_data:/qdrant/storage
      - ./.data/qdrant_snapshots:/qdrant/snapshots
